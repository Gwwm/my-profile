experiences:
  title: Experience
  info:
    - role: Product Lead (1st PM for P2P Labs)
      time: Jul 2024 – Present
      company: P2P.ORG
      details: |
        - Spearheaded credit infra SDK enabling wallets & dApps to support
          stablecoin payments with yielding/idle assets as collateral;
          MVP tested with a >$300M TVL client on HyperEVM.
        - Defined Solana monetization strategy and secured executive
          buy-in; led 0→1 MEV Booster (relayer + transaction execution
          middleware) to enhance revenue, onboarding >10 clients within six
          months and reaching ~$300K MRR.
        - Built white-label validator service for CEXs and institutions to
          deploy branded Solana LST products; drove GTM strategy to surpass
          6M SOL TVL.
    - role: Product Manager
      time: Feb 2024 – Jul 2024
      company: Nethermind
      details: |
        - Launched new RPC SaaS product, built the user onboarding journey,
          and defined roadmap and success metrics to resolve prioritized
          user problems; secured 12 happy users in the first months of
          launch.
        - Revamped Voyager dashboard with real-time insights into
          Starknet activity; improved information architecture and data
          visualization to lift user engagement 30% and session duration
          25%.
        - Collaborated in a four-person team to research and develop a
          novel data availability solution leveraging FRI proofs and
          successfully pitched it as an internal incubation.
    - role: DeFi Product Manager
      time: Nov 2022 – Jan 2024
      company: Binance.US
      details: |
        - Grew staking AUM 150% by prioritizing top assets and enhancing
          rebalance logic to optimize capital efficiency, improving
          redemption time and APR by 30%.
        - Conducted research and built roadmaps for the Web3 Wallet,
          including HD/MPC wallet architecture, Wallet Management, Earn,
          Swap, and dApp marketplace; coordinated GTM strategy to convert
          5K users in pre-launch.
        - Designed ML pricing algorithms for crypto withdrawals with Random
          Forests, increasing revenue 350% to contribute 20% of company
          revenue while holding guiderail metrics within 1% via A/B tests.
    - role: DeFi/NFT Product Operations Associate
      time: Nov 2021 – Nov 2022
      company: Crypto.com
      details: |
        - Iterated admin panel for sales logistics across 50+ events and
          cross-functional teams of 60, ensuring smooth launches that grew
          quarterly revenue 40× to over $10M within three quarters.
        - Proposed and adopted DMCA and zero-refund policy, collaborating
          with cross-functional teams and integrating Hive API content
          moderation to reduce refund costs 95% (> $2M/month).
        - Spearheaded the Loaded Lion strategic venture with 10+ developers
          and designers, driving over $46M traded volume through roadmap
          design and community building.
    - role: Co-founder
      time: Sep 2018 – Nov 2022
      company: Metagenesis
      details: |
        - Built the InvestMan community of 20,000+ across YouTube and other
          platforms by leading a team of seven and directing cryptocurrency
          content for brand visibility and audience engagement.
        - Expanded Metagenesis services to monetization roadmaps for the
          creator economy, launching crypto and NFT projects that generated
          over US$2M revenue for 20+ Asian creators.

